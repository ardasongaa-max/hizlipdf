<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HızlıPDF — Kitap Arama</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans selection:bg-rose-500/20 selection:text-rose-200">
    <header class="border-b border-zinc-900 bg-zinc-950/80 backdrop-blur-sm sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 bg-rose-600 rounded flex items-center justify-center text-white font-bold text-sm">H</div>
                <span class="font-semibold tracking-tight text-sm">hızlıpdf</span>
            </div>
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="text-xs text-zinc-400 hover:text-zinc-200 transition-colors">GitHub</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-16 pb-24">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-semibold tracking-tight mb-2">Kitap Arama</h1>
            <p class="text-sm text-zinc-400">Aradığınız kitabı anında bulun ve indirin.</p>
        </div>

        <form id="searchForm" class="flex gap-2 mb-12">
            <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Kitap adı, yazar veya ISBN..." 
                    class="w-full bg-zinc-900 border border-zinc-800 rounded-lg pl-10 pr-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-700 transition-colors"
                    required
                >
            </div>
            <button 
                type="submit" 
                class="bg-rose-600 hover:bg-rose-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition-colors flex items-center gap-2 shrink-0 cursor-pointer"
            >
                <span>Ara</span>
            </button>
        </form>

        <div id="resultsContainer">
            <div id="initialState" class="text-center py-16 border border-dashed border-zinc-900 rounded-xl">
                <i data-lucide="book-open" class="w-8 h-8 text-zinc-700 mx-auto mb-3"></i>
                <p class="text-sm text-zinc-400">Aramaya başlamak için yukarıdaki kutucuğu kullanın.</p>
            </div>

            <div id="loadingState" class="hidden space-y-3">
                <div class="bg-zinc-900/50 border border-zinc-900 rounded-xl p-4 animate-pulse">
                    <div class="h-4 bg-zinc-800 rounded w-3/4 mb-2"></div>
                    <div class="h-3 bg-zinc-800/60 rounded w-1/2"></div>
                </div>
                <div class="bg-zinc-900/50 border border-zinc-900 rounded-xl p-4 animate-pulse">
                    <div class="h-4 bg-zinc-800 rounded w-2/3 mb-2"></div>
                    <div class="h-3 bg-zinc-800/60 rounded w-1/3"></div>
                </div>
                <div class="bg-zinc-900/50 border border-zinc-900 rounded-xl p-4 animate-pulse">
                    <div class="h-4 bg-zinc-800 rounded w-4/5 mb-2"></div>
                    <div class="h-3 bg-zinc-800/60 rounded w-2/5"></div>
                </div>
            </div>

            <div id="emptyState" class="hidden text-center py-16 border border-zinc-900 rounded-xl">
                <i data-lucide="folder-search" class="w-8 h-8 text-zinc-700 mx-auto mb-3"></i>
                <p class="text-sm text-zinc-300 font-medium mb-1">Sonuç bulunamadı</p>
                <p class="text-xs text-zinc-500">Farklı anahtar kelimeler deneyebilirsiniz.</p>
            </div>

            <div id="errorState" class="hidden text-center py-16 border border-zinc-900 rounded-xl">
                <i data-lucide="alert-circle" class="w-8 h-8 text-rose-500/80 mx-auto mb-3"></i>
                <p class="text-sm text-zinc-300 font-medium mb-1">Bağlantı Hatası</p>
                <p id="errorMessage" class="text-xs text-zinc-500">İstek işlenirken bir sorun oluştu.</p>
            </div>

            <div id="bookList" class="hidden space-y-3"></div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const initialState = document.getElementById('initialState');
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');
        const bookList = document.getElementById('bookList');

        function showState(state) {
            initialState.classList.add('hidden');
            loadingState.classList.add('hidden');
            emptyState.classList.add('hidden');
            errorState.classList.add('hidden');
            bookList.classList.add('hidden');

            if (state === 'initial') initialState.classList.remove('hidden');
            if (state === 'loading') loadingState.classList.remove('hidden');
            if (state === 'empty') emptyState.classList.remove('hidden');
            if (state === 'error') errorState.classList.remove('hidden');
            if (state === 'success') bookList.classList.remove('hidden');
        }

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;

            showState('loading');

            try {
                const targetUrl = `https://libgen.li/index.php?req=${encodeURIComponent(query)}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Ağ yanıtı başarısız (408/502).');
                
                const htmlText = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                const rows = doc.querySelectorAll('table tr');
                const books = [];

                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].querySelectorAll('td');
                    if (cols.length >= 10) {
                        const author = cols[1]?.textContent?.trim() || 'Bilinmiyor';
                        const titleTag = cols[2]?.querySelector('a');
                        const title = titleTag ? titleTag.textContent.trim() : (cols[2]?.textContent?.trim() || 'İsimsiz');
                        
                        let downloadLink = '#';
                        if (titleTag && titleTag.getAttribute('href')) {
                            let href = titleTag.getAttribute('href');
                            if (!href.startsWith('http')) {
                                href = 'https://libgen.li/' + href.replace(/^\/+/, '');
                            }
                            downloadLink = href;
                        }

                        const year = cols[4]?.textContent?.trim() || '';
                        const size = cols[7]?.textContent?.trim() || '';
                        const extension = cols[8]?.textContent?.trim() || '';

                        books.push({ author, title, year, size, extension, downloadLink });
                    }
                }

                if (books.length === 0) {
                    showState('empty');
                    return;
                }

                bookList.innerHTML = books.map(book => `
                    <div class="bg-zinc-900/40 border border-zinc-900 hover:border-zinc-800 transition-colors rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="space-y-1 min-w-0">
                            <h2 class="text-sm font-medium text-zinc-100 truncate">${escapeHtml(book.title)}</h2>
                            <p class="text-xs text-zinc-400 truncate">${escapeHtml(book.author)}</p>
                            <div class="flex items-center gap-2 pt-1">
                                ${book.extension ? `<span class="px-1.5 py-0.5 rounded bg-zinc-800 text-[10px] uppercase font-medium text-zinc-300">${escapeHtml(book.extension)}</span>` : ''}
                                ${book.size ? `<span class="text-xs text-zinc-500">${escapeHtml(book.size)}</span>` : ''}
                                ${book.year ? `<span class="text-xs text-zinc-500">${escapeHtml(book.year)}</span>` : ''}
                            </div>
                        </div>
                        <a 
                            href="${escapeHtml(book.downloadLink)}" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="inline-flex items-center justify-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium px-3.5 py-2 rounded-lg transition-colors shrink-0"
                        >
                            <span>İndir</span>
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                `).join('');

                lucide.createIcons();
                showState('success');

            } catch (err) {
                errorMessage.textContent = err.message || 'Beklenmeyen bir hata oluştu.';
                showState('error');
            }
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
